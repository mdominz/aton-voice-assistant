<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATON">
<meta name="theme-color" content="#02040a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ATON</title>
<style>
:root{
  --fundo:#02040a; --azul:#3b8bff; --azul-claro:#9cc4ff; --texto:#d6e4ff; --suave:#4f6a99;
  --quente:#ffa040; --verde:#5bffb0; --erro:#ff6b7a; --vidro:rgba(10,22,48,.55); --linha:rgba(59,139,255,.45);
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);overflow:hidden;
  font-family:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
#nucleo{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD superior */
.topo{position:fixed;top:0;left:0;right:0;padding:calc(var(--topo) + 10px) 22px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.marca{font-size:22px;font-weight:200;letter-spacing:8px;color:var(--texto)}
.status{background:none;border:0;padding:4px 0;text-align:right;cursor:pointer;color:var(--azul);font:10.5px var(--mono);letter-spacing:1px}
.status .linha1{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.status .ponto{width:6px;height:6px;border-radius:50%;background:var(--erro)}
.status.on .ponto{background:var(--verde)}
.status .linha2{opacity:.6;margin-top:3px}

/* área sob o núcleo */
.sob{position:fixed;left:28px;right:28px;top:67%;text-align:center;z-index:2;pointer-events:none}
.saudacao{transition:opacity .4s}
.saudacao .ola{font-size:18px;font-weight:300;color:var(--azul-claro);opacity:.85}
.saudacao .dica{font:10.5px var(--mono);letter-spacing:1px;color:var(--suave);opacity:.7;margin-top:6px}
.legenda{position:absolute;inset:0 0 auto 0;opacity:0;transition:opacity 1.5s}
.legenda.vis{opacity:1;transition:opacity .25s}
.legenda .eu{font:13px var(--mono);color:var(--suave);margin-bottom:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.legenda .ele{font-size:17px;line-height:24px;font-weight:300;color:var(--texto);text-shadow:0 0 8px var(--azul);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.oculto{opacity:0!important}
/* imagens da internet que acompanham a resposta */
.imgs{position:fixed;left:14px;right:14px;top:calc(var(--topo) + 58px);z-index:3;opacity:0;transition:opacity .4s;pointer-events:none}
.imgs.vis{opacity:1;pointer-events:auto}
.imgs .fotos{display:flex;gap:8px;justify-content:center}
.imgs .fotos a{position:relative;flex:0 1 31%;min-width:0;display:block}
.imgs img{display:block;width:100%;height:88px;object-fit:cover;border:1px solid var(--azul);border-radius:8px;box-shadow:0 0 10px var(--azul)}
.imgs a.video::after{content:"\25B6";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;background:rgba(2,6,16,.75);border:1px solid var(--azul-claro);color:var(--azul-claro);font-size:13px;padding-left:2px}
.imgs .links{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.imgs .links a{font:11px var(--mono);letter-spacing:.5px;color:var(--azul-claro);border:1px solid var(--azul);border-radius:8px;padding:6px 9px;text-decoration:none;background:var(--vidro)}
.mini{background:none;border:1px solid var(--azul);color:var(--azul-claro);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
a.mini{display:block;text-align:center;margin:14px 0 4px}
.aviso{position:fixed;left:30px;right:30px;top:64%;text-align:center;font:12px var(--mono);color:var(--erro);z-index:3;pointer-events:none}

/* toque longo no núcleo */
#zonaNucleo{position:fixed;left:50%;top:45%;width:54vw;height:54vw;transform:translate(-50%,-50%);border-radius:50%;z-index:1}

/* controles */
.base{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(max(var(--base),34px) + 22px);z-index:2}
.controles{display:flex;justify-content:space-evenly;align-items:flex-end}
.btn{position:relative;width:54px;height:54px;border-radius:50%;border:1px solid var(--azul);background:var(--vidro);
  box-shadow:0 0 10px var(--azul);display:grid;place-items:center;color:var(--azul-claro);cursor:pointer;padding:0;
  transition:transform .15s,border-color .3s,box-shadow .3s}
.btn:active{transform:scale(1.08)}
.btn svg{width:21px;height:21px}
.btn.grande{width:78px;height:78px;box-shadow:0 0 18px var(--azul)}
.btn.grande::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed currentColor;opacity:.5;border-color:var(--azul)}
.btn.ativo{border-color:var(--quente);box-shadow:0 0 22px var(--quente);transform:scale(1.08);color:var(--quente)}
.btn.ativo::before{border-color:var(--quente)}
.btn:focus-visible{outline:2px solid var(--azul-claro);outline-offset:3px}

/* ícone de ondas */
.ondas{display:flex;align-items:center;gap:2.2px;height:30px}
.ondas i{display:block;width:2.8px;height:30px;border-radius:3px;background:currentColor;transform-origin:center;
  animation:respira 2.8s ease-in-out infinite}
.ondas i:nth-child(1){--h:.35;animation-duration:2.8s}.ondas i:nth-child(2){--h:.7;animation-duration:3.1s}
.ondas i:nth-child(3){--h:1;animation-duration:2.6s}.ondas i:nth-child(4){--h:.6;animation-duration:3.3s}
.ondas i:nth-child(5){--h:.85;animation-duration:2.9s}.ondas i:nth-child(6){--h:.45;animation-duration:3.4s}
.ondas i:nth-child(7){--h:.3;animation-duration:3s}
@keyframes respira{0%,100%{transform:scaleY(calc(var(--h)*.75))}50%{transform:scaleY(calc(var(--h)*.95))}}
@keyframes fala{0%,100%{transform:scaleY(calc(var(--h)*.75))}50%{transform:scaleY(1)}}
.btn.ativo .ondas i{animation-name:fala;animation-duration:.55s}
.btn.ativo .ondas i:nth-child(2n){animation-duration:.42s}
.btn.ativo .ondas i:nth-child(3n){animation-duration:.67s}

/* escrever */
.escrita{display:none;align-items:center;gap:10px;margin-bottom:6px}
.base.escrevendo .controles{display:none}
.base.escrevendo .escrita{display:flex}
.escrita input{flex:1;min-width:0;font-size:16px;color:var(--texto);padding:13px 18px;border-radius:26px;border:1px solid var(--linha);
  background:var(--vidro);outline:none;-webkit-user-select:text;user-select:text;font-family:inherit}
.escrita input::placeholder{color:var(--suave)}
.escrita .btn{width:48px;height:48px;box-shadow:none}

/* painéis */
.painel{position:fixed;inset:0;z-index:10;display:none}
.painel.aberto{display:block}
.hist{background:rgba(2,4,10,.97);display:none;flex-direction:column;padding-top:calc(var(--topo) + 12px)}
.hist.aberto{display:flex;animation:sobe .3s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.hist-topo{display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:10.5px var(--mono);letter-spacing:1px;color:var(--azul)}
.icone-btn{background:none;border:0;color:var(--azul-claro);padding:6px;cursor:pointer}
.icone-btn svg{width:24px;height:24px}
.hist-lista{flex:1;overflow-y:auto;padding:22px 22px calc(var(--base) + 22px);display:flex;flex-direction:column;justify-content:flex-end;gap:14px;-webkit-user-select:text;user-select:text}
.hist-lista .eu{font:13px var(--mono);color:var(--suave);text-align:right}
.hist-lista .ele{font-size:17px;line-height:24px;font-weight:300}
.hist-lista .vazio{font:10.5px var(--mono);color:var(--suave);text-align:center}

.cfg{background:rgba(2,4,10,.8)}
.folha{position:absolute;left:0;right:0;bottom:0;background:#0a1428;border-radius:22px 22px 0 0;padding:22px 22px calc(var(--base) + 30px);
  display:flex;flex-direction:column;gap:8px;animation:sobe .3s ease-out}
.alca{width:40px;height:4px;border-radius:2px;background:#16264a;align-self:center;margin-bottom:10px}
.folha h2{margin:0 0 6px;font-size:18px;font-weight:500}
.folha label{font-size:13px;color:var(--suave);margin-top:8px}
.folha input[type=text],.folha input[type=password]{font-size:16px;color:var(--texto);background:var(--fundo);border:1px solid #16264a;border-radius:12px;padding:13px;outline:none;font-family:inherit;-webkit-user-select:text;user-select:text}
.folha input:focus{border-color:var(--azul)}
.linha-cfg{display:flex;align-items:center;margin-top:16px;gap:12px}
.linha-cfg div{flex:1}
.linha-cfg small{display:block;color:var(--suave);font-size:13px;margin-top:2px}
.chave{position:relative;width:51px;height:31px;flex:0 0 auto}
.chave input{opacity:0;width:0;height:0}
.chave span{position:absolute;inset:0;background:#16264a;border-radius:31px;transition:.2s}
.chave span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.chave input:checked+span{background:var(--azul)}
.chave input:checked+span::after{transform:translateX(20px)}
.salvar{margin-top:18px;background:#1e5bff;color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:500;font-family:inherit;cursor:pointer}

.print{background:rgba(2,4,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.print.aberto{display:flex}
.print img{max-width:100%;max-height:70%;border-radius:10px;border:1px solid var(--linha)}
.print p{font:10.5px var(--mono);letter-spacing:1px;color:var(--azul);margin:0}
.ao-vivo{font:12px var(--mono);letter-spacing:1.5px;color:#fff;background:#1e5bff;border-radius:14px;padding:14px 22px;text-decoration:none}
</style>
</head>
<body>
<canvas id="nucleo" aria-hidden="true"></canvas>
<div id="zonaNucleo" aria-label="Segure o núcleo para falar"></div>

<header class="topo">
  <div class="marca">ATON</div>
  <button class="status" id="status" aria-label="Configurações">
    <div class="linha1"><span id="statusTxt">MODO DEMONSTRAÇÃO</span><span class="ponto"></span></div>
    <div class="linha2">NÚCLEO: <span id="estadoTxt">EM REPOUSO</span></div>
  </button>
</header>

<div class="sob">
  <div class="saudacao" id="saudacao">
    <div class="ola" id="ola">Olá</div>
    <div class="dica" id="dica">segure para falar</div>
  </div>
  <div class="legenda" id="legenda" aria-live="polite">
    <div class="eu" id="falaEu"></div>
    <div class="ele" id="falaAton"></div>
  </div>
</div>
<div class="aviso" id="aviso" role="status"></div>
<div class="imgs" id="imgs"></div>

<div class="base" id="base">
  <div class="controles">
    <button class="btn" id="btnTela" aria-label="Ver a tela do PC">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/></svg>
    </button>
    <button class="btn grande" id="btnFalar" aria-label="Segure para falar">
      <span class="ondas"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </button>
    <button class="btn" id="btnEscrever" aria-label="Escrever">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a1.9 1.9 0 0 1 2.7 2.7L12 15.4 8.5 16l.6-3.5z"/></svg>
    </button>
  </div>
  <form class="escrita" id="formEscrita" autocomplete="off">
    <input id="entrada" type="text" placeholder="Diga ao Aton…" enterkeyhint="send" aria-label="Mensagem para o Aton">
    <button class="btn" id="btnEnviar" type="submit" aria-label="Enviar">
      <svg id="icoEnviar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </form>
</div>

<section class="painel hist" id="hist" aria-label="Histórico">
  <div class="hist-topo">HISTÓRICO
    <button class="icone-btn" id="fecharHist" aria-label="Fechar histórico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="hist-lista" id="histLista"></div>
</section>

<section class="painel cfg" id="cfg" aria-label="Conexão com o PC">
  <form class="folha" id="formCfg" autocomplete="off">
    <div class="alca"></div>
    <h2>Conexão com o PC</h2>
    <label for="cfgServidor">Endereço do Aton</label>
    <input id="cfgServidor" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://seu-pc.tail1234.ts.net">
    <label for="cfgToken">Token</label>
    <input id="cfgToken" type="password" autocapitalize="none" autocorrect="off" placeholder="Arquivo aton_token.txt no PC">
    <div class="linha-cfg">
      <div>Modo demonstração<small>Testa o app sem o PC ligado.</small></div>
      <label class="chave"><input id="cfgDemo" type="checkbox"><span></span></label>
    </div>
    <div class="linha-cfg">
      <div>Notificações<small id="pushInfo">Lembretes e tarefas concluídas, mesmo com o app fechado.</small></div>
      <button class="mini" id="btnPush" type="button">Ativar</button>
    </div>
    <a class="mini" id="lnkConfig" href="config.html">Configurações do Aton ›</a>
    <button class="salvar" type="submit">Salvar e conectar</button>
  </form>
</section>

<section class="painel print" id="print" aria-label="Tela do PC">
  <img id="printImg" alt="Tela do PC">
  <!-- controle ao vivo: abre o app RustDesk direto no PC (IP do PC no Tailscale, acesso direto por IP).
       O IP NÃO fica em arquivo nenhum: ao servir a página, o Aton pergunta ao Tailscale o IP do PC e troca __RUSTDESK_ID__. -->
  <a class="ao-vivo" id="aoVivo" href="rustdesk://connection/new/__RUSTDESK_ID__">CONTROLAR AO VIVO</a>
  <p>TOQUE PARA FECHAR</p>
</section>

<script>
/* =================== NÚCLEO (mesmo código do Aton do PC) =================== */

var cv=document.getElementById('nucleo'),ctx=cv.getContext('2d'),W,H;
function resize(){var d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

var rgb=function(a){return a.map(function(v){return Math.round(v*255)})};
var mix=function(a,b,t){return a.map(function(v,i){return v+(b[i]-v)*t})};
var col=function(c,a){return 'rgba('+rgb(c).join(',')+','+a+')'};
function rgb2hsl(r,g,b){var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
 if(d>0){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]}
function hsl2rgb(h,s,l){var f=function(p,q,t){t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
 if(s===0)return[l,l,l];var q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;return[f(p,q,h+1/3),f(p,q,h),f(p,q,h-1/3)]}

// estados vindos do app: idle | listening | thinking | speaking | offline
var AI={state:'idle',k:0,ph:0},offK=0,energy=1;
window.setEstado=function(s){AI.state=s};
var BASE_C=[.12,.5,1],BASE_A=[.45,.3,1],HOT=[1,.6,.22],DIM=[.28,.34,.5];

var parts=[];function newPart(){return{a:Math.random()*6.283,d:Math.random()*1.2,v:(Math.random()*.004+.001)*(Math.random()<.5?-1:1),s:Math.random()*1.6+.5,l:Math.random()}}
for(var i=0;i<45;i++)parts.push(newPart());

var T=0,last=performance.now(),boot=null,curC=BASE_C.slice(),curA=BASE_A.slice();
function frame(now){
 if(boot===null){ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);last=now;requestAnimationFrame(frame);return}
 var dt=Math.min(.05,(now-last)/1000);last=now;AI.ph+=dt;
 var act=AI.state!=='idle'&&AI.state!=='offline';
 AI.k+=((act?1:0)-AI.k)*Math.min(1,dt*3);
 offK+=((AI.state==='offline'?1:0)-offK)*Math.min(1,dt*2);
 energy+=((AI.state==='offline'?0:1)-energy)*Math.min(1,dt*1.2);
 T+=dt*(.3+.7*energy)*(1+AI.k*(AI.state==='thinking'?1.4:.6));

 var tC=BASE_C,tA=BASE_A;
 if(AI.state==='listening'){tC=mix(BASE_C,HOT,.75);tA=mix(BASE_A,HOT,.5)}
 else if(AI.k>.01)tC=mix(BASE_C,BASE_A,.5*AI.k);
 tC=mix(tC,DIM,offK);tA=mix(tA,DIM,offK);
 curC=mix(curC,tC,.05);curA=mix(curA,tA,.05);var C=curC,A=curA;

 var cx=W/2,cy=H*.45,R=Math.min(W*.205,H*.112);
 var aiP=AI.state==='listening'?.12+.1*Math.sin(AI.ph*6):AI.state==='thinking'?.1+.14*Math.abs(Math.sin(AI.ph*9)):AI.state==='speaking'?.15+.22*Math.abs(Math.sin(AI.ph*7.3)*Math.sin(AI.ph*2.1)):0;
 var pulse=aiP*AI.k;
 var bt=(now-boot)/1000,L=function(a,b){return Math.max(0,Math.min(1,(bt-a)/(b-a)))},E=function(a,b){return 1-Math.pow(1-L(a,b),3)};
 var gA=L(.1,1.6),pa=L(.6,2.2),cs=E(.05,1.2),sw=L(.9,2.1),hf=L(1.9,2.6);

 ctx.globalCompositeOperation='source-over';ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);
 var g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*3.6);g.addColorStop(0,col(C,(.26+pulse*.25)*(.55+.45*energy)*gA));g.addColorStop(1,col(C,0));
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='lighter';
 var hy=H*.74;ctx.lineWidth=1;
 for(var gi=-12;gi<=12;gi++){ctx.strokeStyle=col(C,.10*gA);ctx.beginPath();ctx.moveTo(W/2+gi*W*.02,hy);ctx.lineTo(W/2+gi*W*.28,H);ctx.stroke()}
 for(var gj=0;gj<10;gj++){var z=((gj+T*.4)%10)/10,gy=hy+(H-hy)*z*z;ctx.strokeStyle=col(C,(.03+z*.12)*gA);ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
 ctx.globalCompositeOperation='source-over';var fg=ctx.createLinearGradient(0,hy-2,0,hy+(H-hy)*.45);fg.addColorStop(0,'rgba(2,4,10,1)');fg.addColorStop(1,'rgba(2,4,10,0)');ctx.fillStyle=fg;ctx.fillRect(0,hy-2,W,(H-hy)*.45+2);ctx.globalCompositeOperation='lighter';

 // partículas orbitando
 for(var pi=0;pi<parts.length;pi++){var p=parts[pi];p.a+=p.v*dt*60*(1+AI.k);p.d+=.0008*dt*60*(p.l>.5?1:-1);
  if(p.d>1.2||p.d<.02){var np=newPart();for(var kk in np)p[kk]=np[kk];p.d=p.l>.5?.15:1.1}
  var r2=R*(1.2+p.d*2.4),x=cx+Math.cos(p.a)*r2*1.25,y=cy+Math.sin(p.a)*r2*.8;
  ctx.fillStyle=col(p.l>.7?A:C,(.25+.5*(1-Math.abs(p.d-.6)))*(.45+.55*energy)*pa);ctx.beginPath();ctx.arc(x,y,p.s*(1+pulse),0,6.283);ctx.fill()}

 // anéis
 ctx.save();ctx.translate(cx,cy);

/* =================== APP =================== */
(function(){
const $ = id => document.getElementById(id);
const ROTULOS = {repouso:'EM REPOUSO',conectando:'CONECTANDO',pensando:'PROCESSANDO',ouvindo:'OUVINDO',gravando:'OUVINDO',falando:'RESPONDENDO',offline:'OFFLINE'};
const MAPA = {repouso:'idle',conectando:'idle',pensando:'thinking',ouvindo:'listening',gravando:'listening',falando:'speaking',offline:'offline'};

let estado = 'conectando', online = false, escrevendo = false, legendaVis = false;
let historico = [];
let cfg = {servidor:'', token:'', demo:true};
try { const s = localStorage.getItem('aton_cfg'); if (s) cfg = JSON.parse(s); } catch(e) {}
// servido pelo próprio PC: o endereço do Aton é este mesmo, e o modo demonstração começa desligado
const vemDoPC = location.protocol === 'https:' && location.hostname.endsWith('.ts.net');
if (vemDoPC) { cfg.servidor = location.origin; if (!localStorage.getItem('aton_cfg')) cfg.demo = false; }

window.iniciar(true);   // abertura toca uma vez por inicialização do app

function saudacao(){ const h = new Date().getHours(); return h>=5&&h<12?'Bom dia':h>=12&&h<18?'Boa tarde':'Boa noite'; }

function setEstado(e){
  estado = e;
  window.setEstado(MAPA[e] || 'idle');
  $('estadoTxt').textContent = ROTULOS[e] || '';
  $('btnFalar').classList.toggle('ativo', e === 'gravando');
  atualizarSaudacao();
}
function setOnline(v){
  online = v;
  $('status').classList.toggle('on', v);
  $('statusTxt').textContent = cfg.demo ? 'MODO DEMONSTRAÇÃO' : v ? 'SISTEMA ONLINE' : 'SISTEMA OFFLINE';
}
function atualizarSaudacao(){
  const mostra = !legendaVis && !escrevendo && ['repouso','conectando','offline'].includes(estado);
  $('ola').textContent = saudacao();
  $('dica').textContent = historico.length ? 'deslize para cima para ver o histórico' : 'segure para falar';
  $('saudacao').classList.toggle('oculto', !mostra);
}

/* ---------- legenda e histórico ---------- */
let timerLeg;
function legenda(eu, ele){
  if (eu !== undefined) $('falaEu').textContent = eu ? '› ' + eu : '';
  if (ele !== undefined) $('falaAton').textContent = ele || '';
  if (eu) historico.push({q:'eu', t:eu});
  if (ele) historico.push({q:'ele', t:ele});
  historico = historico.slice(-100);
  legendaVis = true; $('legenda').classList.add('vis'); atualizarSaudacao();
  clearTimeout(timerLeg);
  timerLeg = setTimeout(() => {
    $('legenda').classList.remove('vis');
    setTimeout(() => { legendaVis = false; atualizarSaudacao(); }, 1500);
  }, 12000);
}
function abrirHist(){
  const l = $('histLista'); l.innerHTML = '';
  if (!historico.length) { const d = document.createElement('div'); d.className = 'vazio'; d.textContent = 'Nada por aqui ainda.'; l.appendChild(d); }
  historico.forEach(m => { const d = document.createElement('div'); d.className = m.q; d.textContent = m.q === 'eu' ? '› ' + m.t : m.t; l.appendChild(d); });
  $('hist').classList.add('aberto'); l.scrollTop = l.scrollHeight;
}
$('fecharHist').onclick = () => $('hist').classList.remove('aberto');

let timerAviso;
function avisar(t){ $('aviso').textContent = t; clearTimeout(timerAviso); timerAviso = setTimeout(() => $('aviso').textContent = '', 4000); }

/* ---------- áudio (o iOS só toca som depois de um toque: destravamos no primeiro toque) ---------- */
const player = new Audio(); player.playsInline = true;
let audioLiberado = false;
function liberarAudio(){
  if (audioLiberado) return; audioLiberado = true;
  player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  player.play().then(() => player.pause()).catch(() => {});
}
document.addEventListener('pointerdown', liberarAudio, {once:false, passive:true});
function tocar(url){
  player.src = url; setEstado('falando');
  player.onended = () => setEstado('repouso');
  player.play().catch(() => setEstado('repouso'));
}

/* ---------- conexão com o PC ---------- */
let ws = null, tentativas = 0, timerReconexao, timerPing;
const base = () => (cfg.servidor || '').trim().replace(/\/+$/, '');

function desconectar(){ clearTimeout(timerReconexao); clearInterval(timerPing); const s = ws; ws = null; if (s) s.close(); }
function conectar(){
  desconectar();
  if (cfg.demo) { setOnline(true); setEstado('repouso'); return; }
  if (!cfg.servidor || !cfg.token) { setOnline(false); setEstado('offline'); if (!cfg.token) avisar('Toque em SISTEMA OFFLINE e cole o token.'); return; }
  setEstado('conectando');
  let sock;
  try { sock = new WebSocket(base().replace(/^http/, 'ws') + '/ws'); }
  catch (e) { avisar('Endereço inválido.'); setEstado('offline'); return; }
  ws = sock;
  sock.onopen = () => { tentativas = 0; sock.send(JSON.stringify({token: cfg.token})); setOnline(true);
    timerPing = setInterval(() => sock.readyState === 1 && sock.send('{"tipo":"ping"}'), 25000); };
  sock.onmessage = e => { try { tratar(JSON.parse(e.data)); } catch (err) {} };
  sock.onclose = e => {
    if (ws !== sock) return;
    clearInterval(timerPing); setOnline(false); setEstado('offline');
    if (e.code === 4001) { avisar('Token recusado. Confira nas configurações.'); return; }
    timerReconexao = setTimeout(() => ws === sock && conectar(), Math.min(1000 * 2 ** tentativas++, 15000));
  };
}
// ao voltar para o app, reconecta na hora
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || cfg.demo) return;
  if (!ws || ws.readyState !== 1) { tentativas = 0; conectar(); }
});

function tratar(m){
  switch (m.tipo) {
    case 'estado': setEstado(m.estado); break;
    case 'transcricao': legenda(m.texto, ''); break;
    case 'resposta': case 'notificacao':
      legenda(undefined, m.texto);
      mostrarImgs(m.imagens || [], m.video, m.links || []);
      if (m.audio_url) tocar(base() + m.audio_url);
      break;
    case 'print': $('printImg').src = 'data:image/jpeg;base64,' + m.imagem; $('print').classList.add('aberto'); setEstado('repouso'); break;
    case 'erro': avisar(m.texto); break;
  }
}
function enviar(obj){
  if (cfg.demo) return demo(obj);
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
  else { avisar('Sem conexão com o PC.'); setEstado('offline'); }
}

/* ---------- modo demonstração ---------- */
function respostaDemo(t){
  t = t.toLowerCase();
  if (t.includes('hora')) return 'Agora são ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) + '.';
  if (t.includes('oi') || t.includes('olá')) return 'Olá. Estou em modo demonstração, o PC ainda não está conectado.';
  return 'Quando o PC estiver conectado, eu executo: "' + t + '".';
}
function demo(obj){
  setEstado('pensando');
  setTimeout(() => {
    if (obj.tipo === 'texto') legenda(undefined, respostaDemo(obj.conteudo));
    if (obj.tipo === 'audio') legenda('(áudio)', 'Recebi seu áudio. No PC, o Whisper vai transcrever.');
    if (obj.tipo === 'print') legenda('ver tela', 'Aqui vai aparecer a tela do PC.');
    setEstado('falando');
    setTimeout(() => setEstado('repouso'), 1800);
  }, 900);
}

/* ---------- gravação (segurar para falar) ---------- */
let gravador = null, pedacos = [], gravando = false, stream = null;
async function iniciarGravacao(){
  if (gravando) return;
  gravando = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    if (!gravando) { stream.getTracks().forEach(t => t.stop()); return; }   // soltou antes de liberar
    gravador = new MediaRecorder(stream); pedacos = [];
    gravador.ondataavailable = e => e.data.size && pedacos.push(e.data);
    gravador.onstop = finalizarGravacao;
    gravador.start();
    setEstado('gravando');
  } catch (e) { gravando = false; avisar('Libere o microfone nos Ajustes do iPhone.'); }
}
function pararGravacao(){
  if (!gravando) return;
  gravando = false;
  if (gravador && gravador.state === 'recording') gravador.stop();
  else setEstado('repouso');
}
function finalizarGravacao(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  const tipo = gravador.mimeType || 'audio/mp4';
  const blob = new Blob(pedacos, {type: tipo});
  if (blob.size < 1500) { setEstado('repouso'); return; }
  setEstado('pensando');
  const r = new FileReader();
  r.onload = () => enviar({tipo:'audio', conteudo:String(r.result).split(',')[1], mime:tipo});
  r.onerror = () => { avisar('Não consegui ler a gravação.'); setEstado('repouso'); };
  r.readAsDataURL(blob);
}
function segurar(el, atraso){
  let timer = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (atraso) timer = setTimeout(iniciarGravacao, atraso); else iniciarGravacao();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => el.addEventListener(ev, () => { clearTimeout(timer); pararGravacao(); }));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
segurar($('btnFalar'), 0);
segurar($('zonaNucleo'), 220);

/* ---------- imagens da resposta ---------- */
let timerImgs = 0;
function mostrarImgs(lista, video, links){
  const box = $('imgs'); box.textContent = ''; clearTimeout(timerImgs);
  if (!lista.length && !video) { box.classList.remove('vis'); return; }
  links = links || []; const lk = t => (links.find(l => l.tipo === t) || {}).url;
  const fotos = document.createElement('div'); fotos.className = 'fotos'; box.appendChild(fotos);
  const item = (src, alt, url, cls) => { const a = document.createElement('a'), i = new Image();
    if (url) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } if (cls) a.className = cls;
    i.alt = alt || ''; i.referrerPolicy = 'no-referrer'; i.onerror = () => a.remove(); i.src = src; a.appendChild(i); fotos.appendChild(a); };
  lista.slice(0, video ? 2 : 3).forEach(x => item(x.url, x.titulo, lk('imagens')));
  if (video) item(video.thumb, 'Vídeo: ' + (video.titulo || ''), video.url, 'video');
  if (links.length) { const row = document.createElement('div'); row.className = 'links';
    links.forEach(l => { const a = document.createElement('a'); a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = l.rotulo + ' ›'; row.appendChild(a); });
    box.appendChild(row); }
  box.classList.add('vis'); timerImgs = setTimeout(() => box.classList.remove('vis'), 60000);
}

/* ---------- notificações push ---------- */
function b64u(s){ const r = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); }
$('btnPush').onclick = async () => {
  const info = $('pushInfo');
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      info.textContent = 'Indisponível aqui. No iPhone, adicione o app à Tela de Início e abra por lá.'; return; }
    if (await Notification.requestPermission() !== 'granted') { info.textContent = 'Permissão negada nos ajustes do aparelho.'; return; }
    info.textContent = 'Ativando…';
    const reg = await navigator.serviceWorker.ready, h = {'x-aton-token': cfg.token};
    const k = await fetch(base() + '/api/push/chave', {headers: h, cache: 'no-store'});
    if (!k.ok) { info.textContent = 'O PC recusou (confira o token).'; return; }
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u((await k.json()).chave)});
    const r = await fetch(base() + '/api/push/inscrever', {method: 'POST', headers: Object.assign({'Content-Type': 'application/json'}, h),
      body: JSON.stringify({inscricao: sub.toJSON()})});
    info.textContent = r.ok ? 'Ativadas neste aparelho. Deve chegar um aviso de teste.' : 'O PC recusou a inscrição.';
  } catch (e) { info.textContent = 'Não consegui ativar: ' + e.message; }
};

/* ---------- botões ---------- */
$('btnTela').onclick = () => { setEstado('pensando'); enviar({tipo:'print'}); };
$('print').onclick = () => $('print').classList.remove('aberto');
$('aoVivo').onclick = e => e.stopPropagation();   // abre o RustDesk sem fechar o print
if ($('aoVivo').getAttribute('href').includes('__RUSTDESK')) $('aoVivo').style.display = 'none';   // sem "rustdesk_id" no config

const entrada = $('entrada');
function abrirEscrita(){ escrevendo = true; $('base').classList.add('escrevendo'); atualizarSaudacao(); entrada.focus(); }
function fecharEscrita(){ escrevendo = false; $('base').classList.remove('escrevendo'); entrada.blur(); atualizarSaudacao(); }
$('btnEscrever').onclick = abrirEscrita;
entrada.addEventListener('input', () => {
  $('icoEnviar').innerHTML = entrada.value.trim() ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : '<path d="M6 6l12 12M18 6L6 18"/>';
});
entrada.addEventListener('blur', () => { setTimeout(() => { if (!entrada.value.trim() && document.activeElement !== entrada) fecharEscrita(); }, 150); });
$('formEscrita').onsubmit = e => {
  e.preventDefault();
  const t = entrada.value.trim();
  entrada.value = ''; entrada.dispatchEvent(new Event('input'));
  fecharEscrita();
  if (!t) return;
  legenda(t, '');
  enviar({tipo:'texto', conteudo:t});
};
// mantém o campo acima do teclado do iPhone
if (window.visualViewport) {
  const ajustar = () => { const off = window.innerHeight - visualViewport.height - visualViewport.offsetTop;
    $('base').style.transform = escrevendo && off > 0 ? 'translateY(' + (-off + Math.max(0, parseFloat(getComputedStyle($('base')).paddingBottom) - 16)) + 'px)' : ''; };
  visualViewport.addEventListener('resize', ajustar); visualViewport.addEventListener('scroll', ajustar);
}

/* ---------- configurações ---------- */
$('status').onclick = () => {
  $('cfgServidor').value = cfg.servidor || ''; $('cfgToken').value = cfg.token || ''; $('cfgDemo').checked = !!cfg.demo;
  $('cfg').classList.add('aberto');
};
$('cfg').addEventListener('click', e => { if (e.target === $('cfg')) $('cfg').classList.remove('aberto'); });
$('formCfg').onsubmit = e => {
  e.preventDefault();
  cfg = {servidor:$('cfgServidor').value.trim(), token:$('cfgToken').value.trim(), demo:$('cfgDemo').checked};
  try { localStorage.setItem('aton_cfg', JSON.stringify(cfg)); } catch (err) {}
  document.activeElement.blur();
  $('cfg').classList.remove('aberto');
  setOnline(false); conectar();
};

/* ---------- deslizar para cima: histórico ---------- */
let y0 = null, x0 = null;
document.addEventListener('touchstart', e => { if (e.touches.length === 1) { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; } }, {passive:true});
document.addEventListener('touchend', e => {
  if (y0 === null || gravando) return;
  const t = e.changedTouches[0], dy = t.clientY - y0, dx = t.clientX - x0; y0 = null;
  if (dy < -60 && Math.abs(dy) > Math.abs(dx) * 1.5 && !$('cfg').classList.contains('aberto') && !escrevendo) abrirHist();
  if (dy > 80 && $('hist').classList.contains('aberto')) $('hist').classList.remove('aberto');
}, {passive:true});
document.addEventListener('touchmove', e => { if (!e.target.closest('.hist-lista')) e.preventDefault(); }, {passive:false});

/* ---------- início ---------- */
setOnline(false); atualizarSaudacao(); conectar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
